<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overmatch - Match Log History for Overwatch 2</title>
  </head>

  <body>
    <h1>Match History List</h1>
    <hr />
    <p id="message"></p>
    <hr />
    <div id="logon-register" style="display:none;">
      <button type="button" id="logon">logon</button>
      <button type="button" id="register">register</button>
    </div>
    <div id="logon-div" style="display:none;">
      <form>
        <div>
          <label for="email">email:</label>
          <input type="email" id="email" />
        </div>
        <div>
          <label for="password">password:</label>
          <input type="password" id="password" />
        </div>
        <button type="button" id="logon-button">logon</button>
        <button type="button" id="logon-cancel">cancel</button>
      </form>
    </div>
    <div id="register-div" style="display:none;">
      <form>
        <div>
          <label for="username ">username:</label>
          <input type="text" id="username" />
        </div>
        <div>
          <label for="email1">email:</label>
          <input type="email" id="email1" />
        </div>
        <div>
          <label for="password1">password:</label>
          <input type="password" id="password1" />
        </div>
        <div>
          <label for="password2">verify password:</label>
          <input type="password" id="password2" />
        </div>
        <button type="button" id="register-button">register</button>
        <button type="button" id="register-cancel">cancel</button>
      </form>
    </div>
    <div id="matches" style="display:none;">
      <p id="matches-message"></p>
      <table id="matches-table">
        <tr id="matches-table-header">
          <th>Map</th>
          <th>Final Score</th>
          <th>Outcome</th>
          <th>Mode</th>
          <th>Date and Time Played</th>
          <th colspan="2"></th>
        </tr>
      </table>
      <button type="button" id="add-match">add match</button>
      <button type="button" id="logoff">log off</button>
    </div>
    <div id="edit-match" style="display:none;">
      <form>
        <div>
          <label for="map">Map:</label>
          <input type="text" id="map" />
        </div>
        <div>
          <label for="score">Final Score:</label>
          <input type="number" id="score" min="0" />
        </div>
        <div>
          <label for="outcome">Outcome:</label>
          <select id="outcome" required>
            <option value="Victory" selected="selected">Victory</option>
            <option value="Defeat">Defeat</option>
            <option value="Draw">Draw</option>
            <option value="Abandoned">Abandoned</option>
          </select>
        </div>
        <div>
          <label for="mode">Game Mode:</label>
          <select id="mode" required>            
            <option value="Clash" selected="selected">Clash</option>
            <option value="Control">Control</option>
            <option value="Escort">Escort</option>
            <option value="Hybrid">Hybrid</option>
            <option value="Flashpoint">Flashpoint</option>
            <option value="Push">Push</option>
          </select>
        </div>
        <div>
          <label for="time">Match Starting Time:</label>
          <input type="time" id="time" name="time"/>
        </div>
        <div>
          <label for="played">Date Played:</label>
          <input type="date" id="played" name="played" />
        </div>
        <button type="button" id="adding-match">add</button>
        <button type="button" id="edit-cancel">cancel</button>
      </form>
    </div>
    <script src="./index.js" type="module"></script>
  </body>
</html>
